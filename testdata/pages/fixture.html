<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InspectAI fixture</title>
  <style>
    :root {
      --ink: #14120e;
      --paper: #f4f1ea;
      --lime: #c8ff4d;
      --rule: #d9d3c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 "IBM Plex Sans", "Helvetica Neue", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid var(--ink);
    }
    header strong { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; }
    main { display: grid; grid-template-columns: 1fr 320px; gap: 28px; padding: 28px; }
    .card {
      background: white;
      border: 1px solid var(--ink);
      padding: 20px;
    }
    label { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin: 12px 0 4px; }
    input, button {
      font: inherit;
      border: 1px solid var(--ink);
      background: var(--paper);
      padding: 8px 10px;
      width: 100%;
    }
    button.primary {
      background: var(--ink);
      color: var(--lime);
      margin-top: 16px;
      cursor: pointer;
    }
    .overflow {
      width: 220px;
      overflow: hidden;
      white-space: nowrap;
      border: 1px dashed var(--ink);
      padding: 8px;
    }
    #shadow-host { min-height: 64px; border: 1px solid var(--rule); padding: 8px; }
    aside li { margin: 8px 0; }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <strong>INSPECTAI / FIXTURE</strong>
    <nav>
      <a href="#billing">Billing</a>
      ·
      <a href="#team">Team</a>
    </nav>
  </header>
  <main>
    <section class="card" id="billing">
      <h1>Billing settings</h1>
      <p>Pin any control. The overflow line below is intentionally clipped.</p>
      <form>
        <label for="company">Company</label>
        <input id="company" name="company" value="Example Co" />
        <label for="plan">Plan</label>
        <input id="plan" name="plan" value="Pro — annual" />
        <button class="primary" type="submit" data-testid="save-billing">Save changes</button>
      </form>
      <p class="overflow">The monthly invoice preview overflows this box on purpose because the label is far too long to fit.</p>
    </section>
    <aside class="card">
      <h2>Team</h2>
      <ul>
        <li>Mayron — owner</li>
        <li>Ada — billing</li>
      </ul>
      <div id="shadow-host"></div>
    </aside>
  </main>
  <script>
    const host = document.getElementById("shadow-host");
    const root = host.attachShadow({ mode: "open" });
    root.innerHTML = `
      <style>
        button { font: 13px ui-monospace, monospace; background: #14120e; color: #c8ff4d; border: 0; padding: 8px 12px; }
      </style>
      <button type="button">Shadow invite</button>
    `;
  </script>
</body>
</html>
