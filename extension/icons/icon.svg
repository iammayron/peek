<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Near-black (#16140F) rounded square -->
  <rect width="512" height="512" rx="112" fill="#16140F" />
  
  <!-- Camera Reticle: Four focusing brackets (L-shapes) -->
  <!-- Top-Left Bracket -->
  <path d="M 148 100 L 100 100 L 100 148" fill="none" stroke="#C8FF4D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right Bracket -->
  <path d="M 364 100 L 412 100 L 412 148" fill="none" stroke="#C8FF4D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left Bracket -->
  <path d="M 100 364 L 100 412 L 148 412" fill="none" stroke="#C8FF4D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right Bracket -->
  <path d="M 412 364 L 412 412 L 364 412" fill="none" stroke="#C8FF4D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Four Crosshair Ticks -->
  <!-- Top Tick -->
  <line x1="256" y1="64" x2="256" y2="88" stroke="#C8FF4D" stroke-width="12" stroke-linecap="round" />
  <!-- Bottom Tick -->
  <line x1="256" y1="424" x2="256" y2="448" stroke="#C8FF4D" stroke-width="12" stroke-linecap="round" />
  <!-- Left Tick -->
  <line x1="64" y1="256" x2="88" y2="256" stroke="#C8FF4D" stroke-width="12" stroke-linecap="round" />
  <!-- Right Tick -->
  <line x1="424" y1="256" x2="448" y2="256" stroke="#C8FF4D" stroke-width="12" stroke-linecap="round" />
  
  <!-- Almond-Shaped Eye (Slightly wider, bolder outline) -->
  <path d="M 144 256 Q 256 144 368 256 Q 256 368 144 256 Z" fill="none" stroke="#C8FF4D" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Lens Eye Pupil: Consists of an outer ring and a solid inner dot -->
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="42" fill="none" stroke="#C8FF4D" stroke-width="12" />
  <!-- Inner dot -->
  <circle cx="256" cy="256" r="14" fill="#C8FF4D" />
</svg>
