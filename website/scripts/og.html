<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Peek OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #16140F;
      color: #F2F0E9;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 80px;
      box-sizing: border-box;
      position: relative;
    }
    .c {
      position: absolute;
      width: 54px;
      height: 54px;
      border: 4px solid #C8FF4D;
    }
    .tl { top: 36px; left: 36px; border-right: 0; border-bottom: 0; }
    .tr { top: 36px; right: 36px; border-left: 0; border-bottom: 0; }
    .bl { bottom: 36px; left: 36px; border-right: 0; border-top: 0; }
    .br { bottom: 36px; right: 36px; border-left: 0; border-top: 0; }
    .kicker {
      font-size: 16px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #C8FF4D;
    }
    h1 {
      font-size: 108px;
      font-weight: 700;
      letter-spacing: -4px;
      margin: 18px 0 0;
      line-height: 0.95;
    }
    .tag {
      font-size: 28px;
      color: #C8FF4D;
      margin-top: 28px;
    }
    .sub {
      font-size: 22px;
      color: #9a9384;
      margin-top: 14px;
      max-width: 34em;
      line-height: 1.4;
    }
    .host {
      position: absolute;
      bottom: 48px;
      right: 80px;
      font-size: 16px;
      color: #8B897F;
    }
  </style>
</head>
<body>
  <div class="c tl"></div>
  <div class="c tr"></div>
  <div class="c bl"></div>
  <div class="c br"></div>
  <div class="kicker">Chrome extension + local daemon</div>
  <h1>PEEK</h1>
  <div class="tag">You pick. The model looks.</div>
  <div class="sub">Point at a node in your real browser. Coding agents get the selector, a slice of HTML, and a cropped screenshot.</div>
  <div class="host">peek.mayronalves.com</div>
</body>
</html>
