<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Peek OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #0a0a0c;
      color: #f4f4f5;
      font-family: "Schibsted Grotesk", "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 80px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 20% -10% -20%;
      background:
        radial-gradient(50% 50% at 50% 80%, rgba(200, 255, 77, 0.2), transparent 70%),
        radial-gradient(40% 70% at 0% 70%, rgba(200, 255, 77, 0.12), transparent 70%),
        radial-gradient(40% 70% at 100% 70%, rgba(200, 255, 77, 0.12), transparent 70%);
      pointer-events: none;
    }
    .kicker {
      font-size: 16px;
      color: #a1a1aa;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 8px 16px;
      margin: 0;
      position: relative;
    }
    h1 {
      font-size: 72px;
      font-weight: 600;
      letter-spacing: -0.045em;
      margin: 28px 0 0;
      line-height: 1.05;
      position: relative;
    }
    .sub {
      font-size: 22px;
      color: #a1a1aa;
      margin-top: 22px;
      max-width: 22em;
      line-height: 1.4;
      position: relative;
    }
    .host {
      position: absolute;
      bottom: 40px;
      font-size: 16px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <p class="kicker">Chrome extension + local daemon</p>
  <h1>You point at a node.<br>The agent gets the node.</h1>
  <p class="sub">Selector, HTML slice, cropped screenshot. Localhost only.</p>
  <div class="host">peek.mayronalves.com</div>
</body>
</html>
